# =====================================================================
# Θ — the frozen evaluation protocol (problem_formulation.tex, Eq. 13)
#
# Every value here was read off the existing configs so that E_Θ *nests*
# the published baseline:
#   - splits          <- factor_template/conf_combined_factors.yaml:107-109
#   - final_test      <- configs/backtest.yaml:85
#   - combiner params <- conf_combined_factors.yaml:86-96 (post Task 1)
#   - topk / n_drop   <- conf_combined_factors.yaml:66-67, backtest.yaml:120-121
#   - kappa0          <- open_cost 0.0005 + close_cost 0.0015
#
# Property 1 (Immutability): this file is loaded ONCE per run and hashed.
# Editing it mid-run has no effect on a resumed session (LoopBase.run pickles
# the whole loop). The logged theta_hash is what makes that visible.
# =====================================================================

protocol_id: csi300_v1
market: csi300
benchmark: SH000300 # conf_combined_factors.yaml:14, backtest.yaml:127
periods_per_year: 252

splits:
  # ALIGNED WITH configs/backtest.yaml:82-85 -- the backtest v2 run is the
  # primary point of comparison between arms, so E_Theta's combiner must train
  # on the same data its model does. Previously these mirrored the in-loop qlib
  # template (2016-2019 / 2020 / 2021), which meant Arm B was fitted on a
  # different window than the backtest that judges both arms.
  train: ["2016-01-01", "2020-12-31"]
  valid: ["2021-01-01", "2021-12-31"]
  final_test: ["2022-01-01", "2025-12-26"]
  search_is: train # IS during search
  search_oos: valid # 2021; final_test is reached only via the explicit report mode

execution: # Eq. 4-5
  delta: 1
  fill_rule: open_next # Φ = open(t+1); matches deal_price:open everywhere
  label_expr: "Ref($close, -2) / Ref($close, -1) - 1" # backtest.yaml:55 — used for IC only

combiner: # procedure A — Eq. 2; FROZEN, seed included
  model: lightgbm
  # Single seed, kept as a list so an ensemble can be enabled without a code
  # change. A 5-seed ensemble at num_leaves 31 was tried and REVERTED: a 2x2
  # over {1,5} seeds x {210,31} leaves gave effects that flipped sign depending
  # on the other variable (ensembling 0.75x at 210 leaves but 1.36x at 31), i.e.
  # the differences sat inside measurement error at n=5 perturbations per cell.
  # It cost ~3x wall-clock for no demonstrable benefit, so the baseline's own
  # single-seed procedure stands.
  seeds: [42]
  params:
    loss: mse
    learning_rate: 0.05 # ← unified in Task 1
    max_depth: 8
    num_leaves: 210
    colsample_bytree: 0.8879
    subsample: 0.8789
    lambda_l1: 205.6999
    lambda_l2: 580.9768
    num_threads: 20
    early_stopping_round: 50
    num_boost_round: 500
  base_features: # conf_combined_factors.yaml:28-29
    - "($close-$open)/$open"
    - "$volume/Mean($volume, 20)"
    - "($high-$low)/Ref($close, 1)"
    - "$close/Ref($close, 1)-1"
  fit_split: train

portfolio:
  # Turnover must be a decision, not a constant. With this off the book always
  # swaps n_drop names, so turnover is pinned at n_drop/topk (measured 0.105
  # across every configuration) and the cost model cannot influence what is
  # traded -- a capacity-aware objective then has nothing to express itself
  # through. See eval/portfolio.py and execution.prediction_scale.
  cost_aware_dropout: true
  swap_hurdle: 1.0 # g — Eq. 6; the baseline's construction
  construction: topk_dropout
  topk: 50 # conf_combined_factors.yaml:66, backtest.yaml:120
  n_drop: 5 # :67, :121
  signed: false # long-only + benchmark excess (baseline-comparable)
  gross_leverage: 1.0 # Σ|w| ≤ 1

  # --- mean_variance member of the admissible family ---
  # Explicit rather than left to the dataclass defaults: turnover_cap defaulted
  # to 0.10, exactly equal to n_drop/topk, so the mean-variance budget bound at
  # the same level the top-k construction is structurally capped at. Both arms
  # then traded the same amount (measured 0.0989 vs 0.1063) and the construction
  # comparison tested nothing.
  #
  # 0.02 is 5x tighter than top-k can go, which is the point: it is the only
  # setting under which "turnover is a budget" differs from "turnover is a
  # by-product". Measured on a real library: cap 0.02 gave net IR -0.0354 at
  # 0.66 bps/day, against -0.2738 at 4.31 bps/day for top-k dropout.
  turnover_cap: 0.02
  risk_aversion: 10.0
  max_weight: 0.05

costs: # Eq. 7
  kappa0: 0.0020 # = open_cost 0.0005 + close_cost 0.0015 → nests Qlib's flat fee
  # Slippage as a fraction of daily volatility per unit traded weight.
  # 0.10 implied 19.7bps one-way (kappa1 * median sigma 1.97%/day), ~3-5x too
  # high for CSI 300 large caps at this book's 0.167% participation of ADV,
  # where cost is spread-dominated. 0.03 implies ~5.9bps, in the credible range.
  # Cuts modelled cost 18.0%/yr -> ~10.6%/yr. Ranking is barely affected: under
  # top-k dropout turnover is structurally pinned, so cost_bps spans only
  # 0.45bps across factors while net_arr spans ~9pp.
  kappa1: 0.03
  kappa2: 0.01 # calibrated: 1% of ADV ⇒ 10 bps of traded notional (see costs.py)
  impact_exponent: 1.5 # φ ∝ |Δw|^{3/2}/√ADV
  beta_per_day: 0.0004 # ≈10%/yr borrow; inert while signed:false
  beta_offlist: .inf # unshortable names
  vol_window: 20
  adv_window: 20
  nav: 100000000.0 # `account:` in all three Qlib configs; normalizes ADV → adv_w
  adv_scale: 1000.0 # Qlib cn_data `$amount` → CNY: true_CNY = $amount*1000/$factor


gates: # F_Theta -- DISABLED
  # Hard admissibility gates are removed. Two measured reasons:
  #  1. Stand-alone IC was anti-correlated with marginal contribution (the best
  #     contributor had rank_ic +0.0004; the best-IC factor was the worst).
  #  2. The replacement, delta_net_ir >= 0, was not reproducible: 3 of 4 sampled
  #     factors flipped their verdict across combiner seeds, because subtracting
  #     two independently-noisy books compounds variance rather than cancelling
  #     it (level sd 0.026-0.060 -> delta sd 0.038-0.071).
  # A gate that returns a different answer for the same factor on the same data
  # is sampling a decision, not computing one. Both arms now accumulate every
  # mined factor, exactly as the published baseline does, and the objective U
  # differentiates them by SCORE rather than by admission.
  # Set any threshold to a float to re-enable that gate.
  gamma_delta: null
  gamma_ic: null
  gamma_ir: null
  tau_max: null
  rho_bar: null
  gamma_cx: null
  turnover_basis: book

decay: # §3.4 item 7
  K: 4
  lambda_d: 0.5

overfit:
  delta_ref: 0.02 # reference IS→OOS RankIC gap for normalizing e_overfit

utility:
  mode: weighted_rank # net_ir | net_arr | weighted_rank
  omega: # must sum to 1
    effectiveness: 0.30
    arr: 0.20
    stability: 0.15
    turnover: 0.10
    diversity: 0.15
    overfit: 0.10
    decay: 0.00 # optional diagnostic (Remark 1); off by default

# ---------------------------------------------------------------------------
# Admission: when U admits a candidate batch to the repository, and when a
# member that has fallen behind is evicted (Eq. 12 / section 3.4).
#
# U is a weighted mean of percentile complements, so 0.5 is "better than the
# median incumbent" -- the adaptive bar the formulation describes: constant in
# value, rising in the standard it encodes as the repository improves.
#
# tau_evict sits below tau_admit deliberately. About half of any repository is
# below its own median by construction, so evicting at the admission bar would
# drop half the members every round and cascade toward empty. The gap is
# hysteresis: a factor must fall clearly behind, not merely below average.
#
# min_size spans two batches rather than one. Factors evaluated together share
# a metric vector, so a repository bootstrapped from a single batch holds one
# distinct point and every percentile collapses to 0 or 1; two batches give the
# ranking something to interpolate between.
admission:
  enabled: true
  tau_admit: 0.50
  tau_evict: 0.25
  min_size: 6


# ---------------------------------------------------------------------------
# Walk-forward validation for the IN-LOOP evaluation only. A single
# train/validate block can sit inside one market regime, so a factor is
# selected on a market that no longer exists by the time the test window
# starts. Folds expand from a common start date and end at the configured
# split, so folds=1 reproduces the fixed split exactly. final_test is never
# involved -- progressive retraining changes how the search SELECTS, not how
# results are reported.
walk_forward:
  enabled: true
  folds: 3
