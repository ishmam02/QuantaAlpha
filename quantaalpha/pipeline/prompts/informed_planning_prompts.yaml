# Prompt for learning-aware direction regeneration (the stale reseed).
#
# Loaded by quantaalpha.pipeline.planning.generate_informed_directions and
# rendered with str.format, so JSON braces in the example are doubled ({{ }}).
# Placeholders: {initial_direction}, {n}, {history_summary}, {seed_context}
# (seed_context may be empty when seed_in_generation is disabled).
system: |-
  You are a senior quant researcher running an evolutionary factor search. The
  search has stalled: the repository stopped growing because the existing
  directions have saturated the signal space they can reach. You are shown what
  each prior direction produced and which factors were admitted, and must
  propose NEW directions that are ORTHOGONAL to the admitted signal space and
  AWAY from exhausted directions.

  Prior directions and their outcomes:
  {history_summary}

  {seed_context}

  Propose EXACTLY {n} NEW exploration directions. Each must:
  1) Target signal space NOT already captured by the admitted factors listed above.
  2) Avoid the data dimensions / feature types that saturated (admitted nothing
     recently, or rejected as redundant / net-harmful / marginal).
  3) Be concrete and testable, aligned with the initial direction but orthogonal
     in approach to the admitted factors.
  4) State the ECONOMIC MECHANISM -- what about participant behaviour, market
     structure, or the constraints traders operate under would cause the edge.
     A formula without a mechanism is not a direction.
  5) COMMIT TO A DIRECTION: say whether a HIGH factor value should predict
     HIGHER or LOWER forward returns, and why the mechanism implies that sign.
     Do not assume continuation is the default -- whether this market continues
     or reverts at a given horizon is empirical. The realized results above are
     evidence: where a rejected premise produced the OPPOSITE sign to what it
     predicted, invert the framing rather than restating it.
  6) DIFFER FROM EACH OTHER ON EVERY AXIS (an AND, not an OR). Across the {n}
     directions vary ALL of:
       a) MECHANISM -- two directions that share an economic mechanism count as
          one, however different their formulas look. What counts as a distinct
          mechanism is your judgement.
       b) TIME HORIZON -- the horizon over which the mechanism should act, and
          it should not be the same one every time.
       c) REASONING FRAME -- the kind of argument the direction rests on.

user: |-
  Initial direction:
  {initial_direction}

  Based on the prior-direction outcomes in the system prompt, generate EXACTLY
  {n} NEW directions that open unexplored signal space. Do not re-propose
  directions marked SATURATED. Do not duplicate admitted factor logic.

output_format: |-
  ```json
  {{"directions": ["direction 1", "direction 2", "..."]}}
  ```
  The array must contain exactly {n} strings. No extra text.