# Evolution Operator Prompts Configuration
# All prompts for mutation and crossover operators
# Language: English
# ============================================================
# MUTATION OPERATOR PROMPTS
# Generate orthogonal strategies for exploration diversity
# ============================================================

mutation:
  system: |
    You are a quantitative researcher proposing the next hypothesis to test after
    an earlier one has been measured.

    You are given a parent hypothesis together with what it actually did: its
    realized metrics, and the evaluation's verdict on it. Read that evidence
    first. What you propose next is your judgement.

    Two facts about how this search is scored, so you know what the proposal is
    up against:

    * A hypothesis is kept or discarded on its MARGINAL contribution to an
      existing book of factors, measured net of trading cost, over five
      bootstrap samples. A premise that is true but already expressed by the
      book contributes nothing measurable.
    * Redundancy against the book is measured separately and enforced at
      admission. You do not need to optimise for being different; that is
      already checked. Difference from the parent is not itself worth anything
      -- an unrelated hypothesis with no edge scores the same as a duplicate.

    So the question to answer is not "what is unlike the parent" but "given what
    the parent's measurement showed, what is worth testing next". Those coincide
    when the parent's premise was measured to be wrong or exhausted; they do not
    coincide when the parent found something real and the next question is what
    else follows from it.

  user: |
    Below is a parent hypothesis and what it measured. Propose the hypothesis
    worth testing next.

    ## Parent Strategy Information

    ### Hypothesis
    {parent_hypothesis}

    ### Factor Expressions
    {parent_factors}

    ### Backtest Metrics
    {parent_metrics}

    ### Evaluation Feedback
    {parent_feedback}

    ---

    ## Requirements

    Start from the parent's measurement, then state the hypothesis worth testing
    next and why that evidence points there.

    1. **Reading of the parent**: what its metrics and verdict establish. Was the
       premise wrong, was it right but already captured by the book, or was it
       right and incompletely expressed? Say which, and on what number.
    2. **New Hypothesis**: the economic mechanism you now propose to test, stated
       so that it could be shown false.
    3. **Why this follows**: how the parent's measurement led you here. If it led
       you to abandon the parent's premise, say what ruled it out. If it led you
       to a neighbouring question, say what the parent established that makes the
       neighbour worth asking.
    4. **Expected Characteristics**: what the resulting factors should look like
       if the mechanism is real, including the sign you expect and over what
       horizon.

    Whether the result resembles the parent or not is an outcome of that
    reasoning, not a target to hit.

    Output in JSON format:
    ```json
    {{
        "parent_reading": "What the parent's measurement establishes, citing the metric",
        "expected_ic_sign": "EXACTLY ONE of \"positive\" or \"negative\". The sign of the cross-sectional IC you predict between this factor and forward returns. This is a COMMITMENT that will be checked against the realized RankIC. A premise that predicts no direction cannot be contradicted by any measurement, and an unfalsifiable claim is not evidence.",
        "new_hypothesis": "The economic mechanism to test next, stated falsifiably",
        "exploration_direction": "Data dimensions and feature types this implies",
        "evidence_link": "How the parent's measurement led to this hypothesis",
        "expected_characteristics": "Expected factor behaviour, including sign and horizon"
    }}
    ```

  simple_user: |
    Based on the following information, generate an orthogonal factor mining hypothesis:

    Parent Hypothesis: {parent_hypothesis}

    Parent Factors: {parent_factors}

    Please propose a new hypothesis that is completely different from the above direction to explore new factor space. Output the new hypothesis text directly.

  suffix_template: |
    ---

    ## Mutation Round Guidance

    An earlier hypothesis has been measured. This round proposes what to test next.

    ### Parent Strategy Summary
    {parent_summary}

    ### What the parent's measurement establishes
    {parent_reading}

    ### Proposed next hypothesis
    - **Hypothesis**: {new_hypothesis}
    - **Exploration Dimension**: {exploration_direction}
    - **How the parent's evidence led here**: {evidence_link}

    ### What this round is scored on
    1. The marginal contribution of the resulting factors to the existing book,
       net of trading cost. A premise the book already expresses contributes
       nothing measurable, however sound it is.
    2. Redundancy against the book is measured separately and enforced at
       admission, so being different from the parent is not itself worth
       anything. An unrelated hypothesis with no edge scores the same as a
       duplicate.

    Resemblance to the parent is an outcome of your reasoning, not a target.
    Propose the hypothesis the evidence points to.

  # Fallback hypotheses when LLM fails
  # fallback_templates REMOVED 2026-08-15.
  #
  # Six canned strategy ideas ("mean reversion opposite to price momentum",
  # "volatility regime switching", "sector rotation vs individual stock alpha",
  # ...) that were injected whenever an LLM call failed. They are author priors,
  # not measured findings, and once injected they are indistinguishable from a
  # hypothesis the system reasoned to -- so any factor descended from one would
  # credit the search with an answer it was handed. A failed call now skips the
  # slot instead (mutation.py: generate_mutation returns {}).


# ============================================================
# REFINEMENT OPERATOR PROMPTS (diagnose-and-refine mutation, Eq. 6)
# Improve a parent that already mined an edge, rather than restart orthogonally.
# The directive is produced deterministically by evolution/diagnosis.py; these
# templates only render it into the prompt (the artifact side-channel).
# ============================================================

refine:
  # Suffix appended to the hypothesis generator's direction. Carries the
  # verdict + directive + parent summary so the LLM sees WHY the parent fell
  # short (AlphaEvolve's "rendered evaluation results" side-channel). The
  # structured refine_directive (threaded separately) drives freeze-vs-refine;
  # this text is the guidance the LLM reads.
  suffix_template: |
    ---

    ## Refinement Round Guidance

    This is a REFINEMENT round, not an orthogonal restart. You are improving a
    PARENT factor that already mined a real edge -- build on its construction,
    do not discard it for an unrelated idea.

    ### Parent Strategy (the prefix to build on)
    {parent_summary}

    ### Diagnosis -- why the parent fell short, and what to change
    {directive_text}

    ### What to keep / what to change
    {keep_change_note}

    Refine the parent per the diagnosis above. Preserve what worked; change
    only what the diagnosis names as the weakness.

  # Block injected into the factor-construction prompt when the hypothesis is
  # FROZEN and only the expressions are refined (the cost-stall case: the
  # premise is sound, the construction is too expensive).
  frozen_prefix_factors: |
    ### Factors to REFINE -- the parent's construction (do NOT discard it)
    {parent_factors}

    ### Refinement directive
    {directive_text}

    The hypothesis is FROZEN. Produce REFINED factor expressions that address
    the directive while preserving the parent's signal. Reuse the parent's
    construction as the starting point and modify only what the directive names
    as the weakness. Do not propose an unrelated factor.

  # Block injected into the hypothesis-revision prompt when the signal itself
  # is the fault (refine_target=hypothesis). The parent hypothesis is the
  # thing to revise, not to keep.
  revise_hypothesis_block: |
    ### Parent hypothesis to revise (the premise did not produce a real edge)
    {parent_hypothesis}

    ### Diagnosis -- why the premise failed
    {directive_text}

    Revise the HYPOTHESIS per the diagnosis (strengthen the signal / change the
    premise), then the factor expressions will be re-derived from the revised
    hypothesis. Keep what was directionally right; change what produced no edge.

    The parent's realized RankIC is in its metrics above, and the parent
    hypothesis stated the direction it PREDICTED. Compare the two: whether the
    realized sign matched the prediction, and by what magnitude, is evidence
    about which part of the premise survived measurement. What that evidence
    implies for the revision is your judgement to make.

    This is a REVISION contract, not a free proposal. Your output MUST be a
    revised version of the parent hypothesis above -- it shares the parent's
    market view and construction, with the diagnosed weakness removed or
    strengthened. If your proposed hypothesis shares no construction or premise
    with the parent, you have RESTARTED, not refined; re-derive from the parent
    instead. State briefly in concise_justification what you kept and what you
    changed relative to the parent.

  keep_change:
    expression: "KEEP the hypothesis (the premise is sound). REFINE the factor expressions to address the diagnosed weakness."
    hypothesis: "REVISE the hypothesis (the premise itself is the weakness). The factor expressions will be re-derived from the revised premise."


# ============================================================
# CROSSOVER OPERATOR PROMPTS
# Combine multiple parent strategies to leverage their strengths
# ============================================================

crossover:
  # Template for formatting a parent trajectory summary (used by the suffix
  # below via _format_parent_summary). The crossover round has no separate
  # "draft a fusion" LLM step -- the hypothesis generator authors the child
  # fresh from the suffix, so only parent_template / phase_names / suffix_template
  # are live here.
  parent_template: |
    ### Parent {idx}: {phase_name}
    **Direction ID**: {direction_id}
    **Hypothesis**: {hypothesis}
    **Factors**:
    {factors}
    **Metrics**:
    {metrics}
    **Feedback**:
    {feedback}
    ---

  # Phase name translations (used by _format_parent_summary).
  phase_names:
    original: "Original Round"
    mutation: "Mutation Round"
    crossover: "Crossover Round"

  # Prompt suffix appended to the hypothesis generator on a crossover round.
  # Eq. 7: recombine the VALIDATED IDEAS of the two best parents into a NEW
  # hypothesis -- not a literal splice of the two expressions, not a plain
  # average. The two parents' strength diagnoses (what each parent's
  # measurement validated, including the lineage-validated segments) are
  # rendered below as inspiration, not as the child. The child is authored
  # fresh by the hypothesis generator, which states which validated decision it
  # inherits from which parent (credible lineage) and pre-registers an IC sign.
  suffix_template: |
    ---

    ## Crossover Round Guidance

    This is a crossover round. Two of the best-performing parents in the
    repository have been selected, and the construction decisions each one's
    measurements VALIDATED have been located. Author a NEW factor whose
    hypothesis combines those validated ideas -- not a literal splice of the
    two expressions, and not a plain average of them.

    ### Parent Strategy Summaries
    {parent_summaries}

    ### What each parent's measurement validated
    {strength_block}

    ### What the measurements say about recombination

    The repository records what happened to previous children, and two facts are
    worth knowing before you choose a form:

    * Children that were a bare product / interaction of two parents
      (`A * B`, `A_x_B`, "conditioned on") have essentially never outperformed
      the better of their two parents on either IC or ICIR in this system.
    * Parents whose realized RankIC have OPPOSITE signs have produced children
      whose edge was weaker than either parent -- the two contributions worked
      against each other.

    Those are observations about outcomes, not instructions. Each parent's
    realized RankIC and turnover are shown above; the combination form is your
    decision, justified from the parents' measured behaviour rather than from
    convention.

    ### What the child has to earn

    1. It must be DIFFERENT from a plain average of its parents. The downstream
       combiner already computes a weighted linear blend of every admitted
       factor automatically -- a child that is only "parent A plus parent B"
       adds nothing the repository does not already have. State what the child
       captures that neither parent captures alone.
    2. It must not inherit a weakness that ALL its parents share. If every
       parent is weak on the same measured dimension, averaging them leaves that
       weakness intact.
    3. It must state, explicitly, which validated decision it inherits from
       which parent -- the lineage the parents' measurements earned. A child
       that carries no identified decision from a parent is not a recombination
       of that parent.
    4. It must be justified by the parents' MEASURED behaviour shown above --
       their RankIC (including sign), turnover, and repository overlap -- not by
       a generic recombination recipe.

    Author a new hypothesis that combines the validated ideas above.


# ============================================================
# ORTHOGONALITY CHECK PROMPTS
# Verify if generated strategies are sufficiently orthogonal
# ============================================================

orthogonality_check:
  system: |
    You are a quantitative strategy analyst responsible for evaluating the orthogonality (independence) between two strategies.

  user: |
    Please evaluate the orthogonality of the following two strategies:

    ## Strategy A
    {strategy_a}

    ## Strategy B
    {strategy_b}

    Please evaluate their orthogonality from the following dimensions (1-10 score, 10 being completely orthogonal):
    1. Data Dimension Orthogonality: Whether they use different data features
    2. Logic Orthogonality: Whether they are based on different investment logic
    3. Time Scale Orthogonality: Whether they focus on different time horizons
    4. Market State Orthogonality: Whether they target different market conditions

    Output in JSON format:
    ```json
    {{
        "data_orthogonality": 8,
        "logic_orthogonality": 7,
        "time_orthogonality": 6,
        "market_orthogonality": 9,
        "overall_score": 7.5,
        "analysis": "Analysis explanation"
    }}
    ```


# ============================================================
# TRAJECTORY SUMMARY PROMPTS
# Format trajectory information for prompts
# ============================================================

trajectory_summary:
  template: |
    **Trajectory ID**: {trajectory_id}
    **Phase**: {phase}
    **Direction**: {direction_id}

    **Hypothesis**:
    {hypothesis}

    **Factors** (top {max_factors}):
    {factors}

    **Backtest Metrics**:
    {metrics}

    **Feedback Summary**:
    {feedback}
