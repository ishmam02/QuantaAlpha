# ============================================================
# QuantaAlpha run configuration
# All experiment parameters are consolidated here
# ============================================================

# ============================================================
# REPRODUCIBILITY
# Seeds Python + NumPy global RNG at the CLI entry point (cli.py:app).
# The evolution operators use unseeded random.shuffle/sample/choices; this
# makes them reproducible so the evolution explores
# identically. Override with QA_SEED.
# ============================================================
seed: 42

# ============================================================
# PLANNING CONFIGURATION
# Controls parallel exploration direction generation
# ============================================================
planning:
  # Enable "parallel planning": expand initial direction into N exploration directions
  enabled: true
  # Number of parallel directions generated by planning
  num_directions: 10
  # Max retries for planning when LLM output does not match JSON format
  max_attempts: 5
  # Use LLM to generate directions: true=call LLM; false=fallback only
  use_llm: true
  # Allow fallback when LLM fails: true=use built-in direction templates
  # Planning prompts file path (relative to qlib_rd_loop directory)
  prompt_file: planning_prompts.yaml
  # Inject the Alpha158(20) seed library as orthogonal-signal context into the
  # LLM direction prompt (common-mode context; user decision 2026-08-12).
  # Seeds stay admitted:False and never enter the zoo -- this only steers what
  # the generator proposes. Set false to disable without a code edit.
  # Disabled 2026-08-23: the OHLCV Alpha158 seeds anchor round-0 directions to
  # price-volume microstructure and prime a TS_MEAN/TS_SUM formula the construct
  # implements verbatim (operator monoculture). De-priming lets directions reach
  # regression-residual / technical-indicator / conditional-logic / cross-sectional
  # framings; the data-driven _market_context() still gives market context.
  seed_in_generation: false

# ============================================================
# EXECUTION CONFIGURATION
# Controls main loop execution parameters
# ============================================================
execution:
  # Max loop iterations; multiplied by steps_per_loop to get step_n when step_n not set
  max_loops: 2
  # Steps per loop: fixed at 5 (propose/construct/calculate/backtest/feedback)
  steps_per_loop: 5
  # Total steps (highest priority); overrides max_loops * steps_per_loop when set
  step_n: null
  # Use local environment for backtest: true=local, false=Docker
  use_local: true
  # Run branches in parallel using multiprocessing
  parallel_execution: true
  # Branch log root; used only when parallel planning enabled with >1 branches
  branch_log_root: log
  # Branch log prefix; log directory name format is {prefix}_{index}
  branch_log_prefix: branch

# ============================================================
# EVOLUTION CONFIGURATION
# Controls evolutionary exploration (mutation and crossover)
# Flow: Original → Mutation → Crossover → Mutation → Crossover → ...
# ============================================================
evolution:
  # Enable evolution mode; overrides traditional planning + parallel execution when enabled
  enabled: true

  # Enable mutation phase; when false, skip mutation rounds (original and crossover only)
  mutation_enabled: true

  # Enable crossover phase; when false, skip crossover rounds (original and mutation only)
  crossover_enabled: true

  # Max evolution rounds (including original, mutation, crossover)
  # Flow: both enabled → round 0=original, 1=mutation, 2=crossover, ...
  #       mutation only → round 0=original, 1+=mutation, ...
  #       crossover only → round 0=original, 1+=crossover, ...
  # 15, not 5. factors_per_hypothesis went 3 -> 1, which cut the expected yield
  # from 150 mined to 35 (expected_factor_count(10, 5, 5, 1)) -- about 4 admitted
  # at the measured 12% gate pass rate, which is not a library. Restoring the
  # budget through ROUNDS rather than directions is deliberate: rounds are where
  # refinement happens, and the round-over-round learning test needs enough
  # generations to show a trend at all (the current baseline is 0 of 7).
  max_rounds: 15

  # Fraction of the previous phase kept as mutation parents, ranked best-first.
  #
  # Was effectively 1.0 -- _prepare_mutation_targets sorted by direction_id and
  # mutated everything, so the below-median half of the population was bred as
  # often as the best of it. That is not a selection operator, and it shows:
  # marginal contribution had no resolvable trend across a 79-batch run
  # (t=+0.42), i.e. the search drifted rather than improved.
  #
  # 0.5 rather than something tighter because the fitness is noisy and a small
  # population collapses in diversity if only the leader breeds.
  #
  # 2026-08-15: raised 0.5 -> 1.0. The intended balance (10 directions, ~5
  # mutations vs 10 crossovers) never materialised -- the 20260815 run got
  # 3 mutations vs 10 crossovers, because TWO cuts compound:
  #   1. admitted parents are excluded from mutation entirely (see
  #      admitted_push_fraction below): 10 parents - 4 admitted = 6
  #   2. mutation_top_fraction 0.5 then halved 6 -> 3
  # and measurement says the cut fell on the wrong operator: mutation IMPROVED
  # on its parents (mean delta -0.278 -> -0.087, net_ir 0.72 -> 1.29) while
  # crossover DEGRADED them (-0.087 -> -0.920, 0/10 admitted). 1.0 keeps every
  # diagnosable parent in the refine bucket; the REFINE/ORTHOGONAL/ADMITTED-PUSH
  # priority ordering still decides what each parent gets.
  mutation_top_fraction: 1.0

  # A fraction of ADMITTED winners also get a push-further refine instead of
  # going to crossover only. 0.0 (the old default) meant the BEST parents were
  # handed exclusively to crossover -- the operator measured to make them worse.
  # 0.3 sends the top ~third of winners to the operator that compounds them,
  # while leaving the rest as crossover stock.
  # 0.5 -- an even split of the winners, rebalanced on measurement rather than
  # on the assumption that recombination compounds. Per-operator output on the
  # 20260821 run, median |rank_ic| over 130 mined factors:
  #
  #     mutation   n=48  0.0114   max 0.0461
  #     original   n=54  0.0088   max 0.0464
  #     crossover  n=28  0.0067   max 0.0192
  #
  # Crossover is the weakest producer on both the median and the ceiling, and at
  # 0.3 the best parents were still going to it 7 times in 10. Note this is the
  # only knob that moves work BETWEEN the two operators: `crossover_n` sets the
  # crossover count AND seeds the pool mutation then draws from, so cutting it
  # shrinks both phases rather than rebalancing them.
  admitted_push_fraction: 0.5

  # Crossover: number of parents selected per crossover operation
  crossover_size: 2
  # Crossover: number of combinations per round (parallelism after crossover)
  #
  # 2026-08-15: cut 10 -> 5. Crossover went 0/10 with mean delta -0.920 on the
  # 20260815 run. The prompt is now fixed (sign-align + linear blend, no bare
  # interaction terms), so crossover is kept rather than disabled -- but at half
  # the budget until it demonstrates a positive delta. Raise it back once it does.
  # 10, matching num_directions, so each round crosses the full previous phase
  # rather than a third of it. With max_rounds 15 this gives
  # expected_factor_count(10, 10, 15, 1) = 150 mined -- the same budget the run
  # had at factors_per_hypothesis: 3, now spent on 150 distinct hypotheses
  # instead of 50 hypotheses paraphrased three ways.
  crossover_n: 10

  # Parallel execution within each evolution phase
  # true: original round = all n directions in parallel; mutation/crossover rounds = all tasks in parallel
  # false: tasks run sequentially
  parallel_enabled: true

  # Prefer diverse crossover combinations (different directions/phases) vs random parent selection
  prefer_diverse_crossover: true

  # Evolution prompts file path (relative to qlib_rd_loop directory)
  prompt_file: evolution_prompts.yaml

  # Parent selection strategy:
  #   best: prioritize best-performing trajectories
  #   random: random selection
  #   weighted: performance-weighted sampling (higher performance = higher weight)
  #   weighted_inverse: inverse performance-weighted (encourage exploring low performers)
  #   top_percent_plus_random: top 30% guaranteed + random from rest (balance exploitation/exploration)
  parent_selection_strategy: best

  # Top percent threshold (only when parent_selection_strategy = "top_percent_plus_random")
  top_percent_threshold: 0.3

  # Fresh start: true=each experiment starts with empty trajectory pool; false=load existing if available
  fresh_start: false   # RESUME gate2: this run's zoo was built by the
                       # FIXED gate, so rehydrating it is not contaminating.
                       # (Set true when starting a run whose predecessor
                       # used a different admission rule.)
  cleanup_on_finish: false

  # Learning-aware reseed: regenerate NEW, outcome-informed directions when the
  # repository grows too slowly. See EvolutionConfig for full semantics.
  # Rounds of INSUFFICIENT growth (below growth_floor) before a stale reseed.
  # 2, not 1. With ~1.2 expected admissions per round, a single below-floor
  # round is well within normal variation; requiring two CONSECUTIVE slow rounds
  # distinguishes a genuinely exhausted direction from ordinary noise.
  reseed_after_stale_rounds: 2
  # A round with < this many admissions counts as stale (does not reset the
  # counter). 2 => a 1-admission creep is still stale.
  # 1, not 2. The floor defines what counts as a healthy round, and it was set
  # against the OLD, looser gate. Under the research gate the measured pass rate
  # is ~12%, so a 10-batch round yields ~1.2 admissions -- meaning a floor of 2
  # marks almost EVERY round stale and, with reseed_after_stale_rounds: 1,
  # reseeds directions before they are ever explored. Directions would churn
  # every round and refinement would never accumulate any depth.
  growth_floor: 1
  # Scheduled immigration: inject fresh informed directions every this-many
  # rounds regardless of growth. 0 disables.
  # 4, not 3. Scheduled immigration is more valuable at 15 rounds than it was at
  # 5 -- it now fires ~3 times instead of once -- but at every 3 rounds it would
  # fire 4+ times on top of stale reseeds, and each reseed resets what a
  # direction has learned. 4 keeps steady turnover without out-pacing refinement.
  reseed_interval: 4

# ============================================================
# QUALITY GATE CONFIGURATION
# Controls factor quality checks before backtesting
# ============================================================
quality_gate:
  # Consistency check (hypothesis–description–expression). Uses LLM to verify and correct expression if needed
  #
  # 2026-08-15: false -> true. This is the step-2 guard a human quant applies --
  # does the expression actually implement the stated hypothesis, and is it free
  # of structural/look-ahead errors. It matters more now that
  # hypothesis_output_format demands a committed `expected_ic_sign`: a factor
  # whose expression contradicts its own premise makes that commitment
  # meaningless and poisons the sign-based learning signal. Costs one LLM call
  # per factor (strict_mode stays false, so only major/critical inconsistencies
  # reject; lesser ones are corrected in up to max_correction_attempts tries).
  consistency_enabled: true

  # Complexity check: symbol length, base features count, free args ratio
  complexity_enabled: true

  # Redundancy check: AST-based subtree matching against factor zoo
  redundancy_enabled: true

  # Strict consistency: true=any inconsistency rejects factor; false=only major/critical
  consistency_strict_mode: false

  # Max correction attempts when inconsistency is found
  max_correction_attempts: 3

# ============================================================
# FACTOR GENERATION CONFIGURATION
# Controls factor proposal and expression generation
# ============================================================
factor:
  # Number of factors to generate per hypothesis
  # 1, not 3. Measured on the mined library: factors from the SAME hypothesis
  # correlate at a median 0.628 versus 0.096 across hypotheses -- 6.6x -- and 8
  # of 20 triples contain a pair above 0.90. A triple carries ~1.7 independent
  # directions, not 3, and 56.7% of within-batch pairs exceed rho_bar=0.60, so
  # batch-mates are mutually excluded from the library anyway.
  #
  # Throughput is roughly a wash (hypothesis generation dominates the LLM call
  # either way). The reason is CREDIT ASSIGNMENT: at 1:1 a failed hypothesis
  # means the IDEA failed, instead of leaving idea and construction confounded --
  # the distinction the whole diagnosis layer exists to make.
  #
  # NOTE: this changes what "150 factors" means; the canonical count came from
  # expected_factor_count(10, 10, 5, 3). Factor count is now a consequence, not
  # a target -- the same logic that caps the library by information content.
  factors_per_hypothesis: 1

  # Complexity constraints (important for preventing overfitting; keep symbol length under ~250)
  complexity:
    # 2026-08-15: 200 -> 250 to remove a prompt/config CONTRADICTION. The
    # construction prompt tells the LLM "Symbol Length (SL) Limit: <= 250
    # characters (STRICT LIMIT)" and .env sets
    # FACTOR_CoSTEER_SYMBOL_LENGTH_THRESHOLD=250, while this gate rejected at
    # 201 -- so a factor written exactly to the stated contract was thrown out.
    # Measured on the archived libraries: 11 of 166 expressions fell in the
    # 201-250 "told it was fine, then rejected" band. An instruction the model
    # cannot satisfy wastes a generation round and teaches it nothing, because
    # the rejection reason contradicts the rule it was given.
    symbol_length_threshold: 250
    base_features_threshold: 5
    free_args_ratio_threshold: 0.5

  # Uniqueness/duplication checking against factor zoo
  #
  # factor_zoo_path was null, and null means FactorRegulator.alphazoo is an
  # EMPTY frame -- so match_alphazoo compared every candidate against nothing,
  # returned a match size of 0, and the duplication gate could never fire. The
  # check reported "enabled: true" throughout. Together with rho_bar: null in
  # the protocol that left novelty unenforced in two independent places.
  #
  # The pool is Alpha158(20), which is what the paper says seeds the search,
  # translated into the mining DSL by quantaalpha/factors/seed_pool.py. The
  # translation is load-bearing rather than cosmetic: mined candidates are
  # written with DELAY/TS_MEAN/TS_STD, so leaving Qlib's Ref/Mean/Std in the
  # zoo would make every structural comparison miss and the check would stay
  # inert in a quieter way. Regenerate with:
  #   python -c "from quantaalpha.factors.seed_pool import write_alphazoo_csv as w; \
  #              w('data/factorlib/alpha158_20_seed_pool.csv')"
  #
  # threshold is the largest common SUBTREE, in nodes, allowed against any
  # seed. The seeds run 5-15 nodes with a median of 8, so 8 catches
  # near-verbatim reuse of a whole seed while leaving incidental overlap --
  # ($close-$open)/$open appears inside plenty of legitimate factors -- alone.
  # This is a pathology filter, not a similarity policy.
  duplication:
    enabled: true
    threshold: 8
    factor_zoo_path: "data/factorlib/alpha158_20_seed_pool.csv"

# ============================================================
# BACKTEST CONFIGURATION
# Controls factor backtesting parameters
# ============================================================
backtest:
  use_docker: false
  timeout: 800
  qlib:
    config_name: conf_baseline.yaml

# ============================================================
# LLM CONFIGURATION
# Controls LLM API behavior
# ============================================================
llm:
  factor_mining_timeout: 999999
  max_retries: 3
  retry_delay: 1.0
  json_mode_strict: true

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
logging:
  level: INFO
  save_snapshots: true
  save_trajectory_pool: true

# ============================================================
# PROMPT FILES CONFIGURATION
# Paths relative to qlib_rd_loop directory
# Factor/hypothesis prompts: quantaalpha/scenarios/qlib/prompts_*.yaml
# ============================================================
prompts:
  planning: planning_prompts.yaml
  evolution: evolution_prompts.yaml
